# Nginx — Cloudflare-fronted reverse proxy for SOR-AI Gateway
#
# Architecture:
#   Client → Cloudflare (Universal SSL, WAF, DDoS) → Nginx (Origin Cert) → Spring Boot Gateway
#
# SSL mode in Cloudflare dashboard: "Full (strict)"
# Origin certificate is mounted at /etc/nginx/certs/cloudflare-origin.{pem,key}

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include            /etc/nginx/mime.types;
    default_type       application/octet-stream;
    server_tokens      off;
    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 1m;

    # ── Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # ── Real IP from Cloudflare ──────────────────────────────────────
    # https://www.cloudflare.com/ips/  (refresh quarterly)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive on;

    # ── Rate limiting ────────────────────────────────────────────────
    limit_req_zone   $binary_remote_addr  zone=api_limit:10m  rate=10r/s;
    limit_req_status 429;

    # ── Logging (no PHI — same as audit log) ─────────────────────────
    log_format cloudflare '$remote_addr - $http_cf_ray [$time_local] "$request" '
                          '$status $body_bytes_sent rt=$request_time '
                          'ua="$http_user_agent"';
    access_log /var/log/nginx/access.log cloudflare;

    # ── Upstream: Spring Boot Gateway ────────────────────────────────
    upstream gateway {
        least_conn;
        server gateway:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── HTTP — redirect everything to HTTPS ──────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS — Cloudflare Origin Cert ───────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.sorai-triage.com;

        ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
        ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Optional: only accept connections from Cloudflare (authenticated origin pulls) ──
        # Uncomment after enabling "Authenticated Origin Pulls" in Cloudflare:
        # ssl_client_certificate /etc/nginx/certs/cloudflare-authenticated-origin-pull-ca.pem;
        # ssl_verify_client on;

        # ── Security headers ──
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── API ──
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass                  http://gateway;
            proxy_http_version          1.1;
            proxy_set_header            Connection "";
            proxy_set_header            Host                $host;
            proxy_set_header            X-Real-IP           $remote_addr;
            proxy_set_header            X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header            X-Forwarded-Proto   https;
            proxy_set_header            CF-Connecting-IP    $http_cf_connecting_ip;
            proxy_set_header            CF-Ray              $http_cf_ray;
            proxy_read_timeout          60s;
            proxy_send_timeout          60s;
            proxy_connect_timeout       5s;
        }

        # ── Actuator: only allow private networks (Prometheus scraping etc.) ──
        location /actuator/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        # ── Root ──
        location = / {
            return 200 'SOR-AI Gateway — POST /api/v1/predict, GET /api/v1/health';
            add_header Content-Type text/plain;
        }

        # ── Custom error pages ──
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"error":"service_unavailable","message":"Backend is restarting — retry in a few seconds"}';
            add_header Content-Type application/json always;
        }
    }
}
