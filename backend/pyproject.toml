[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:tests/htmlcov",
]
markers = [
    "integration: tests that touch the real model registry",
    "slow: tests that take >5 seconds",
]
