# Production orchestration: Nginx → Spring Boot Gateway → FastAPI ML Service
#                                       │
#                                       └──→ Kafka (audit log)
#                              FastAPI → Ollama (LLM stack)
#
# Run from project root:
#   docker compose -f backend/docker-compose.yml up -d

name: sorai

services:

  # ── ML inference (Python + joblib models + SHAP) ─────────────────
  fastapi:
    build:
      context: ..
      dockerfile: backend/Dockerfile.fastapi
    container_name: sorai-fastapi
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_ENABLED=true
      - OLLAMA_PARSER_MODEL=llama3
      - OLLAMA_NLP_MODEL=medgemma:27b
      - OLLAMA_SYNTHESIS_MODEL=qwen3.6
      - ALLOWED_ORIGINS=https://sorai-triage.com,http://localhost:5173
    expose:
      - "8000"
    restart: unless-stopped
    networks: [sorai-net]

  # ── API Gateway (Spring Boot 3 + WebFlux) ────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: backend/Dockerfile.gateway
    container_name: sorai-gateway
    depends_on:
      fastapi:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - ML_BASE_URL=http://fastapi:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AUDIT_ENABLED=true
    expose:
      - "8080"
    restart: unless-stopped
    networks: [sorai-net]

  # ── Reverse proxy + SSL + rate limiting + load balancing ─────────
  nginx:
    image: nginx:1.27-alpine
    container_name: sorai-nginx
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks: [sorai-net]

  # ── Audit log infrastructure ─────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: sorai-kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LOG_RETENTION_HOURS=720         # 30 days
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka
    expose:
      - "9092"
    restart: unless-stopped
    networks: [sorai-net]

  # ── Local LLM serving (Layer 0 / 1B / 2) ─────────────────────────
  # Mounts the host's existing Ollama model store so we don't re-download
  # llama3, medgemma:27b, qwen3.6 inside the container.
  ollama:
    image: ollama/ollama:latest
    container_name: sorai-ollama
    volumes:
      # NOTE: edit this path to your host's Ollama models directory.
      # WSL example: /mnt/c/Users/piotr/.ollama
      # Linux:       ~/.ollama
      # macOS:       ~/.ollama
      - ${OLLAMA_HOST_DIR:-/mnt/c/Users/piotr/.ollama}:/root/.ollama
    expose:
      - "11434"
    # Optional public binding for direct testing — disable in production
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks: [sorai-net]
    # GPU support — uncomment when running on a CUDA host with nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: ["gpu"]

volumes:
  kafka-data:
  ollama-data:

networks:
  sorai-net:
    driver: bridge
